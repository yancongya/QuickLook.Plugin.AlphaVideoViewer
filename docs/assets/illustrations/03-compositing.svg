<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 720" role="img" aria-labelledby="title desc" data-run="paused">
<title id="title">一帧纹理取两个任意源矩形，预乘输出透明画面</title><desc id="desc">AlphaVideoViewer 功能示意；分层 SVG 绘制的合成原理示意，不是 Windows 实测截图。</desc>
<defs>
<linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a0a"/><stop offset=".55" stop-color="#141414"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e1e1e"/><stop offset="1" stop-color="#191919"/></linearGradient>
<linearGradient id="art" x1=".12" y1="0" x2=".88" y2="1"><stop stop-color="#c9c9c9"/><stop offset=".38" stop-color="#e8e8e8"/><stop offset=".72" stop-color="#d8d8d8"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient>
<linearGradient id="maskGray" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#f2f2f2"/><stop offset=".5" stop-color="#9c9c9c"/><stop offset="1" stop-color="#646464"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#e8e8e8" stop-opacity=".24"/><stop offset="1" stop-color="#e8e8e8" stop-opacity="0"/></radialGradient>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#1e1e1e"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#191919"/></pattern>
<pattern id="maskStripe" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#2a2a2a"/><rect width="10" height="4" fill="#3f3f3f"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".5"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/></filter>
<symbol id="gift" viewBox="0 0 100 100">
  <path d="M50 90C21 69 5 52 5 33 5 18.5 16 8 30 8c8.7 0 16.5 4.4 20 11.2C53.5 12.4 61.3 8 70 8 84 8 95 18.5 95 33c0 19-16 36-45 57Z" fill="url(#art)"/>
  <ellipse cx="31" cy="29" rx="11" ry="7" transform="rotate(-32 31 29)" fill="#ffffff" opacity=".3"/>
</symbol>
<symbol id="giftMask" viewBox="0 0 100 100">
  <path d="M50 90C21 69 5 52 5 33 5 18.5 16 8 30 8c8.7 0 16.5 4.4 20 11.2C53.5 12.4 61.3 8 70 8 84 8 95 18.5 95 33c0 19-16 36-45 57Z" fill="url(#maskGray)"/>
</symbol>
</defs><style>
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.hd{font-size:19px;fill:#efefef}.t1{font-size:16px;fill:#efefef}.t2{font-size:14px;fill:#9c9c9c}.t3{font-size:12.5px;fill:#7c7c7c}.bold{font-weight:600}.em{fill:#e8e8e8}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.rect-rgb{animation:pickRgb 8s infinite}.rect-alpha{animation:pickAlpha 8s infinite}
.gate{animation:gate 8s infinite}
.tex{animation:tex 8s infinite}
.out{animation:out 8s infinite}
@keyframes pickRgb{0%,6%{opacity:.6}16%,100%{opacity:1}}
@keyframes pickAlpha{0%,20%{opacity:.6}30%,100%{opacity:1}}
@keyframes gate{0%,36%{opacity:.55}46%,100%{opacity:1}}
@keyframes tex{0%,48%{opacity:.6}58%,100%{opacity:1}}
@keyframes out{0%,62%{opacity:.6}72%,100%{opacity:1}}
.blink{animation:blink 8s infinite}
@keyframes blink{0%,36%,100%{opacity:.6}46%,56%{opacity:1}}
</style>
<rect x="0" y="0" width="1068" height="720" fill="url(#page)"/>
<ellipse cx="534" cy="330" rx="420" ry="320" fill="url(#glow)" opacity=".8"/>
<text x="48" y="58" class="t3 em" style="letter-spacing:1.5px">自写 WebGL 合成器</text>
<text x="48" y="88" class="hd">一帧纹理里取两个任意源矩形，rgb × alpha 预乘输出</text>
<g filter="url(#shadow)">
<rect x="48" y="112" width="336" height="404" rx="12" fill="#141414" stroke="#2e2e2e"/>
<path d="M48 124a12 12 0 0 1 12-12h312a12 12 0 0 1 12 12v24H48Z" fill="url(#bar)"/>
<path d="M48 148H384" stroke="#2a2a2a"/>
<text x="70" y="137" class="t2 bold">一帧纹理</text>
<text x="360" y="137" class="t3 mono" text-anchor="end">840 × 1167</text>
<g class="tex">
<rect x="70" y="170" width="292" height="230" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<use href="#giftMask" x="84" y="176" width="66" height="66"/>
<rect x="84" y="176" width="66" height="66" fill="url(#maskStripe)" opacity=".18"/>
<use href="#gift" x="222" y="230" width="132" height="132"/>
</g>
<g class="rect-alpha">
<rect x="84" y="176" width="66" height="66" fill="none" stroke="#9c9c9c" stroke-width="2.5" stroke-dasharray="8 5"/>
</g>
<g class="rect-rgb">
<rect x="222" y="230" width="132" height="132" fill="none" stroke="#e8e8e8" stroke-width="2.5" stroke-dasharray="9 6"/>
</g>
<rect x="66" y="252" width="102" height="24" rx="5" fill="#1b1b1b" stroke="#2e2e2e"/>
<text x="117" y="268" class="t3" text-anchor="middle" style="fill:#cccccc">uAlpha 源矩形</text>
<rect x="222" y="368" width="132" height="24" rx="5" fill="#262626" stroke="#333333"/>
<text x="288" y="384" class="t3" text-anchor="middle" style="fill:#dcdcdc">uRgb 源矩形</text>
<path d="M150 190h40" stroke="#9c9c9c" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="196" y="194" class="t3" style="fill:#9c9c9c">主区 1/2 分辨率</text>
<text x="70" y="428" class="t3">两个矩形互不重叠、可以不等宽不等高</text>
<text x="70" y="452" class="t3">遮罩降采样成主区一半分辨率也能对齐</text>
<rect x="70" y="470" width="292" height="32" rx="8" fill="#101010" stroke="#282828"/>
<text x="216" y="491" class="t3 mono" text-anchor="middle" style="fill:#9c9c9c">uRgb / uAlpha 各传一个 vec4</text>
</g>
<g class="gate" filter="url(#soft)">
<rect x="404" y="230" width="188" height="200" rx="14" fill="#101010" stroke="#e8e8e8" stroke-width="1.6"/>
<rect x="404" y="230" width="188" height="44" rx="14" fill="#212121"/>
<rect x="404" y="258" width="188" height="16" fill="#212121"/>
<text x="498" y="258" class="t2 bold" text-anchor="middle" style="fill:#dcdcdc">片元着色器</text>
<rect x="424" y="296" width="148" height="52" rx="8" fill="#0a0a0a" stroke="#282828"/>
<text x="436" y="318" class="t3 mono" style="fill:#dcdcdc">c = texture(uRgb)</text>
<text x="436" y="338" class="t3 mono" style="fill:#cccccc">a = texture(uAlpha)</text>
<text x="498" y="372" class="t1 bold" text-anchor="middle" style="fill:#efefef">c × a</text>
<text x="498" y="400" class="t3 mono" text-anchor="middle" style="fill:#9c9c9c">premultiplied</text>
<path d="M436 300h-24M560 300h24" stroke="#e8e8e8" stroke-width="1.6" stroke-dasharray="5 4"/>
</g>
<path d="M392 330h10" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round"/>
<path d="M396 324l6 6-6 6" fill="none" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M596 330h10" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round"/>
<path d="M600 324l6 6-6 6" fill="none" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="out" filter="url(#shadow)">
<rect x="612" y="112" width="408" height="404" rx="12" fill="#141414" stroke="#2e2e2e"/>
<path d="M612 124a12 12 0 0 1 12-12h384a12 12 0 0 1 12 12v24H612Z" fill="url(#bar)"/>
<path d="M612 148H1020" stroke="#2a2a2a"/>
<text x="634" y="137" class="t2 bold">合成输出</text>
<text x="998" y="137" class="t3 mono" text-anchor="end">420 × 1167</text>
<rect x="636" y="170" width="360" height="230" rx="4" fill="url(#checker)" stroke="#2e2e2e"/>
<use href="#gift" x="740" y="222" width="152" height="152"/>
<text x="650" y="428" class="t3">棋盘格处即透明区域，画面与遮罩严格对齐</text>
<rect x="636" y="446" width="360" height="56" rx="10" fill="#101010" stroke="#282828"/>
<text x="656" y="470" class="t3 mono" style="fill:#dcdcdc">gl_FragColor = vec4(c * a, a)</text>
<text x="656" y="492" class="t3 mono" style="fill:#9c9c9c">blendFunc(ONE, ONE_MINUS_SRC_ALPHA)</text>
</g>
<g filter="url(#soft)">
<rect x="48" y="560" width="972" height="96" rx="12" fill="#101010" stroke="#2e2e2e"/>
<rect x="48" y="560" width="4" height="96" rx="2" fill="#e8e8e8"/>
<text x="76" y="592" class="t2 bold">为什么不用现成的库</text>
<text x="76" y="618" class="t3">主流播放器假设遮罩与画面同长宽比，只在两块等比矩形里取值。</text>
<text x="76" y="640" class="t3">腾讯 VAP 的遮罩恒为主区一半分辨率，等比假设直接失效 —— 自写合成器才能正确取值。</text>
<rect x="836" y="580" width="164" height="56" rx="10" fill="#212121" stroke="#333333"/>
<text x="918" y="604" class="t3" text-anchor="middle" style="fill:#dcdcdc">像素级对齐</text>
<text x="918" y="624" class="t3" text-anchor="middle" style="fill:#9c9c9c">零猜测</text>
</g>
</svg>
