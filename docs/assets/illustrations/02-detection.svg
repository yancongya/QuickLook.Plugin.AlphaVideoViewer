<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 720" role="img" aria-labelledby="title desc" data-run="paused">
<title id="title">三级识别：元数据、几何初筛与像素自检</title><desc id="desc">AlphaVideoViewer 功能示意；分层 SVG 绘制的识别流程与素材图形，不是 Windows 实测截图。</desc>
<defs>
<linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a0a"/><stop offset=".55" stop-color="#141414"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e1e1e"/><stop offset="1" stop-color="#191919"/></linearGradient>
<linearGradient id="art" x1=".12" y1="0" x2=".88" y2="1"><stop stop-color="#c9c9c9"/><stop offset=".38" stop-color="#e8e8e8"/><stop offset=".72" stop-color="#d8d8d8"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient>
<linearGradient id="maskGray" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#f2f2f2"/><stop offset=".5" stop-color="#9c9c9c"/><stop offset="1" stop-color="#646464"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#e8e8e8" stop-opacity=".22"/><stop offset="1" stop-color="#e8e8e8" stop-opacity="0"/></radialGradient>
<radialGradient id="softGray" cx=".5" cy=".5" r=".5"><stop stop-color="#c9c9c9" stop-opacity=".38"/><stop offset="1" stop-color="#c9c9c9" stop-opacity="0"/></radialGradient>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#1e1e1e"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#191919"/></pattern>
<pattern id="maskStripe" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#2a2a2a"/><rect width="10" height="4" fill="#3f3f3f"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".5"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity=".45"/></filter>
<symbol id="gift" viewBox="0 0 100 100">
  <path d="M50 90C21 69 5 52 5 33 5 18.5 16 8 30 8c8.7 0 16.5 4.4 20 11.2C53.5 12.4 61.3 8 70 8 84 8 95 18.5 95 33c0 19-16 36-45 57Z" fill="url(#art)"/>
  <ellipse cx="31" cy="29" rx="11" ry="7" transform="rotate(-32 31 29)" fill="#ffffff" opacity=".3"/>
</symbol>
<symbol id="giftMask" viewBox="0 0 100 100">
  <path d="M50 90C21 69 5 52 5 33 5 18.5 16 8 30 8c8.7 0 16.5 4.4 20 11.2C53.5 12.4 61.3 8 70 8 84 8 95 18.5 95 33c0 19-16 36-45 57Z" fill="url(#maskGray)"/>
</symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e8e8e8"/><path d="M7 12.4l3.4 3.4L17.4 8.8" fill="none" stroke="#191919" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs><style>
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.hd{font-size:19px;fill:#efefef}.t1{font-size:16px;fill:#efefef}.t2{font-size:14px;fill:#9c9c9c}.t3{font-size:12.5px;fill:#7c7c7c}.bold{font-weight:600}.em{fill:#e8e8e8}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.stage1{animation:s1 8s infinite}.stage2{animation:s2 8s infinite}.stage3{animation:s3 8s infinite}
.link1{animation:lk1 8s infinite}.link2{animation:lk2 8s infinite}.link3{animation:lk3 8s infinite}
.result{animation:res 8s infinite}
@keyframes s1{0%,6%{opacity:.42}14%,100%{opacity:1}}
@keyframes s2{0%,24%{opacity:.42}32%,100%{opacity:1}}
@keyframes s3{0%,48%{opacity:.42}56%,100%{opacity:1}}
@keyframes lk1{0%,8%{opacity:.25}16%,100%{opacity:1}}
@keyframes lk2{0%,28%{opacity:.25}36%,100%{opacity:1}}
@keyframes lk3{0%,52%{opacity:.25}60%,100%{opacity:1}}
@keyframes res{0%,66%{opacity:.35;transform:translateY(10px)}76%,100%{opacity:1;transform:none}}
.scan{animation:scan 8s linear infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.85}30%{transform:translateX(300px);opacity:.85}34%{opacity:0}100%{transform:translateX(300px);opacity:0}}
.result-in{animation:rin 8s infinite}
@keyframes rin{0%,68%{opacity:0}80%,100%{opacity:1}}
</style>
<rect x="0" y="0" width="1068" height="720" fill="url(#page)"/>
<ellipse cx="300" cy="300" rx="330" ry="300" fill="url(#glow)" opacity=".7"/>
<g filter="url(#shadow)">
<rect x="48" y="88" width="470" height="372" rx="12" fill="#141414" stroke="#2e2e2e"/>
<path d="M48 100a12 12 0 0 1 12-12h446a12 12 0 0 1 12 12v24H48Z" fill="url(#bar)"/>
<path d="M48 124H518" stroke="#2a2a2a"/>
<text x="72" y="113" class="t2 bold">源文件 · 单帧画面</text>
<text x="494" y="113" class="t3 mono" text-anchor="end">840 × 1167</text>
<g>
<rect x="112" y="150" width="168" height="234" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<ellipse cx="196" cy="292" rx="76" ry="66" fill="url(#softGray)"/>
<use href="#giftMask" x="138" y="206" width="116" height="116"/>
<path d="M112 150h168v234H112z" fill="url(#maskStripe)" opacity=".13"/>
<rect x="280" y="150" width="168" height="234" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<ellipse cx="364" cy="292" rx="80" ry="70" fill="url(#glow)" opacity=".8"/>
<use href="#gift" x="306" y="206" width="116" height="116"/>
</g>
<path d="M280 150V384" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="6 5"/>
<g class="scan"><path d="M280 150V384" stroke="#e8e8e8" stroke-width="2.4" opacity=".9"/></g>
<rect x="112" y="150" width="168" height="234" rx="4" fill="none" stroke="#2e2e2e"/>
<rect x="112" y="150" width="168" height="26" rx="4" fill="#141414" opacity=".92"/>
<text x="124" y="168" class="t3" style="fill:#efefef">Alpha 遮罩</text>
<rect x="280" y="150" width="168" height="26" rx="4" fill="#141414" opacity=".92"/>
<text x="292" y="168" class="t3" style="fill:#efefef">RGB 画面</text>
<rect x="120" y="392" width="64" height="22" rx="11" fill="#262626" stroke="#414141"/>
<text x="152" y="407" class="t3" text-anchor="middle" style="fill:#cccccc">灰度</text>
<rect x="288" y="392" width="64" height="22" rx="11" fill="#262626" stroke="#333333"/>
<text x="320" y="407" class="t3" text-anchor="middle" style="fill:#dcdcdc">彩色</text>
<text x="368" y="407" class="t3">左右半幅拼接</text>
<text x="72" y="440" class="t3">字节 AlphaPlayer 方案：右半 RGB · 左半灰度 Alpha</text>
</g>
<g class="stage1">
<rect x="556" y="88" width="464" height="104" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="556" y="88" width="4" height="104" rx="2" fill="#e8e8e8"/>
<circle cx="596" cy="122" r="15" fill="#262626" stroke="#333333"/>
<text x="596" y="127" class="t1 bold" text-anchor="middle" style="fill:#dcdcdc">1</text>
<text x="624" y="118" class="t1 bold">vapc 元数据</text>
<text x="624" y="142" class="t3">腾讯 VAP v2：读文件里的 vapc 盒，直接拿到官方对位坐标</text>
<text x="624" y="164" class="t3 mono" style="fill:#9c9c9c">rgbFrame / aFrame</text>
<rect x="866" y="104" width="138" height="26" rx="13" fill="#262626" stroke="#333333"/>
<text x="935" y="121" class="t3" text-anchor="middle" style="fill:#dcdcdc">命中即定案</text>
</g>
<g class="link1"><path d="M788 192v18" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"/><path d="M782 204l6 6 6-6" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="stage2">
<rect x="556" y="216" width="464" height="104" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="556" y="216" width="4" height="104" rx="2" fill="#e8e8e8"/>
<circle cx="596" cy="250" r="15" fill="#262626" stroke="#333333"/>
<text x="596" y="255" class="t1 bold" text-anchor="middle" style="fill:#dcdcdc">2</text>
<text x="624" y="246" class="t1 bold">几何初筛</text>
<text x="624" y="270" class="t3">没有元数据时：用 MP4 容器 tkhd 尺寸先做粗筛</text>
<text x="624" y="292" class="t3 mono" style="fill:#9c9c9c">切半后宽高比 1:1 ~ 2.5:1</text>
<rect x="866" y="232" width="138" height="26" rx="13" fill="#262626" stroke="#333333"/>
<text x="935" y="249" class="t3" text-anchor="middle" style="fill:#dcdcdc">通过 · 继续</text>
</g>
<g class="link2"><path d="M788 320v18" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"/><path d="M782 332l6 6 6-6" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="stage3">
<rect x="556" y="344" width="464" height="116" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="556" y="344" width="4" height="116" rx="2" fill="#e8e8e8"/>
<circle cx="596" cy="380" r="15" fill="#262626" stroke="#333333"/>
<text x="596" y="385" class="t1 bold" text-anchor="middle" style="fill:#dcdcdc">3</text>
<text x="624" y="374" class="t1 bold">像素自检</text>
<text x="624" y="398" class="t3">解码几帧，逐个候选方案打分</text>
<text x="624" y="422" class="t3">遮罩有多纯灰 × 画面有多彩 × 两块包围盒是否对齐</text>
<rect x="836" y="360" width="168" height="26" rx="13" fill="#262626" stroke="#333333"/>
<text x="920" y="377" class="t3" text-anchor="middle" style="fill:#dcdcdc">通过 · 确认拼接</text>
<text x="624" y="446" class="t3 mono" style="fill:#7c7c7c">score = weight × purity × color × align</text>
</g>
<g class="result" filter="url(#soft)">
<rect x="48" y="492" width="972" height="160" rx="12" fill="#101010" stroke="#2e2e2e"/>
<rect x="48" y="492" width="4" height="160" rx="2" fill="#e8e8e8"/>
<g class="result-in">
<rect x="76" y="516" width="112" height="112" rx="6" fill="url(#checker)" stroke="#2e2e2e"/>
<use href="#gift" x="88" y="528" width="88" height="88"/>
</g>
<text x="216" y="540" class="t3 em" style="font-size:13px;letter-spacing:1px">结论</text>
<text x="216" y="572" class="hd">确认是拼接素材 · 半幅拼接</text>
<text x="216" y="602" class="t2">Alpha 位置：左　·　源 840 × 1167　·　输出 420 × 1167</text>
<text x="216" y="628" class="t3">交给合成器做 rgb × alpha 透明合成</text>
<path d="M660 572h48" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round"/>
<path d="M700 564l10 8-10 8" fill="none" stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="726" y="538" width="62" height="68" rx="6" fill="#101010" stroke="#2e2e2e"/>
<use href="#giftMask" x="733" y="545" width="48" height="48"/>
<text x="757" y="618" class="t3" text-anchor="middle">遮罩</text>
<text x="800" y="578" class="t1 bold" text-anchor="middle" style="fill:#9c9c9c">×</text>
<rect x="816" y="538" width="62" height="68" rx="6" fill="#101010" stroke="#2e2e2e"/>
<use href="#gift" x="823" y="545" width="48" height="48"/>
<text x="847" y="618" class="t3" text-anchor="middle">画面</text>
<text x="890" y="578" class="t1 bold" text-anchor="middle" style="fill:#9c9c9c">=</text>
<rect x="906" y="538" width="62" height="68" rx="6" fill="url(#checker)" stroke="#2e2e2e"/>
<use href="#gift" x="913" y="545" width="48" height="48"/>
<text x="937" y="618" class="t3" text-anchor="middle" style="fill:#dcdcdc">合成</text>
</g>
</svg>
