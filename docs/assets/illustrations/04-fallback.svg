  <path d="M50 90C21 69 5 52 5 33 5 18.5 16 8 30 8c8.7 0 16.5 4.4 20 11.2C53.5 12.4 61.3 8 70 8 84 8 95 18.5 95 33c0 19-16 36-45 57Z" fill="url(#maskGray)"/>
</symbol>
<symbol id="icViewer" viewBox="0 0 30 30"><rect x="4.5" y="7" width="21" height="16" rx="2.5" fill="none" stroke="#9c9c9c" stroke-width="1.6"/><path d="M12 11.5l8 3.5-8 3.5Z" fill="#9c9c9c"/></symbol>
<symbol id="icBack" viewBox="0 0 30 30"><path d="M22 12a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="#9c9c9c" stroke-width="1.8" stroke-linecap="round"/><path d="M21.5 2.6 19.6 6l4 1.6" fill="none" stroke="#9c9c9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="icMerge" viewBox="0 0 30 30"><rect x="3.5" y="9" width="8" height="12" rx="1.6" fill="none" stroke="#e8e8e8" stroke-width="1.6"/><rect x="18.5" y="9" width="8" height="12" rx="1.6" fill="#e8e8e8" fill-opacity=".45" stroke="#e8e8e8" stroke-width="1.6"/><path d="M11.5 15h7" stroke="#e8e8e8" stroke-width="1.8" stroke-linecap="round"/><path d="M16 12.6 18.8 15 16 17.4" fill="none" stroke="#e8e8e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs><style>
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.hd{font-size:20px;fill:#efefef}.t1{font-size:16px;fill:#efefef}.t2{font-size:14px;fill:#9c9c9c}.t3{font-size:12.5px;fill:#7c7c7c}.bold{font-weight:600}.em{fill:#e8e8e8}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.hub{animation:hub 8s infinite}
@keyframes hub{0%,8%{opacity:.4}16%,100%{opacity:1}}
.br-a{animation:bra 8s infinite}.br-b{animation:brb 8s infinite}.br-c{animation:brc 8s infinite}
.ln-a{animation:lna 8s infinite}.ln-b{animation:lnb 8s infinite}.ln-c{animation:lnc 8s infinite}
@keyframes bra{0%,22%{opacity:.55}32%,100%{opacity:1}}
@keyframes brb{0%,46%{opacity:.55}56%,100%{opacity:1}}
@keyframes brc{0%,70%{opacity:.55}80%,100%{opacity:1}}
@keyframes lna{0%,24%{opacity:.2}34%,100%{opacity:1}}
@keyframes lnb{0%,48%{opacity:.2}58%,100%{opacity:1}}
@keyframes lnc{0%,72%{opacity:.2}82%,100%{opacity:1}}
.pulse{animation:pulse 8s ease-in-out infinite;transform-origin:534px 214px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
</style>
<rect x="0" y="0" width="1068" height="720" fill="url(#page)"/>
<ellipse cx="534" cy="230" rx="420" ry="300" fill="url(#glow)" opacity=".7"/>
<text x="48" y="58" class="t3 em" style="letter-spacing:1.5px">宁漏勿抢</text>
<text x="48" y="88" class="hd">宁可当普通视频，也绝不抢一个不是拼接素材的文件</text>
<g class="hub" filter="url(#shadow)">
<rect x="330" y="116" width="408" height="96" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="330" y="116" width="4" height="96" rx="2" fill="#e8e8e8"/>
