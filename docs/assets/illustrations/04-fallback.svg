<rect x="414" y="344" width="106" height="132" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<use href="#giftMask" x="422" y="365" width="90" height="90"/>
<rect x="414" y="344" width="106" height="132" rx="4" fill="url(#maskStripe)" opacity=".14"/>
<rect x="520" y="344" width="106" height="132" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<use href="#gift" x="528" y="365" width="90" height="90"/>
</g>
<text x="414" y="496" class="t3">半幅 / 四分幅拼接</text>
<rect x="414" y="504" width="240" height="26" rx="13" fill="#212121" stroke="#333333"/>
<text x="534" y="521" class="t3" text-anchor="middle" style="fill:#dcdcdc">透明合成</text>
<text x="414" y="548" class="t2" style="fill:#dcdcdc">输出真正的透明画面</text>
</g>
<g class="br-c" filter="url(#soft)">
<rect x="736" y="286" width="284" height="270" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="736" y="286" width="284" height="44" rx="12" fill="#1f1f1f"/>
<rect x="736" y="314" width="284" height="16" fill="#1f1f1f"/>
<circle cx="762" cy="308" r="6" fill="#9c9c9c"/>
