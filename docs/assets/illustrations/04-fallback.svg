<g class="ln-b"><path d="M534 212v74" fill="none" stroke="#e8e8e8" stroke-width="2.4" stroke-linecap="round"/><path d="M528 280l6 6 6-6" fill="none" stroke="#e8e8e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="ln-c"><path d="M534 212v34H880v34" fill="none" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M874 274l6 6 6-6" fill="none" stroke="#9c9c9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="br-a" filter="url(#soft)">
<rect x="48" y="286" width="284" height="270" rx="12" fill="#141414" stroke="#2e2e2e"/>
<rect x="48" y="286" width="284" height="44" rx="12" fill="#1f1f1f"/>
<rect x="48" y="314" width="284" height="16" fill="#1f1f1f"/>
<circle cx="74" cy="308" r="6" fill="#9c9c9c"/>
