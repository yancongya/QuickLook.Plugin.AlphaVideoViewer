<use href="#gift" x="872" y="365" width="90" height="90" opacity=".1"/>
</g>
<text x="758" y="496" class="t3">遮罩把画面整个抹没了</text>
<rect x="758" y="504" width="240" height="26" rx="13" fill="#1f1f1f" stroke="#2e2e2e"/>
<text x="878" y="521" class="t3" text-anchor="middle" style="fill:#cccccc">coverage &lt; 0.02</text>
<text x="758" y="548" class="t2" style="fill:#efefef">退回原始画面预览</text>
</g>
<g filter="url(#soft)">
<rect x="48" y="588" width="972" height="80" rx="12" fill="#101010" stroke="#2e2e2e"/>
<rect x="48" y="588" width="4" height="80" rx="2" fill="#e8e8e8"/>
<use href="#icViewer" x="76" y="606" width="30" height="30"/>
<text x="120" y="618" class="t2 bold">只有确认是拼接素材，插件才接管播放</text>
<text x="120" y="644" class="t3">任何存疑的文件都原样交回系统播放器，绝不显示一片空白、也绝不劫持普通视频。</text>
<rect x="852" y="606" width="148" height="44" rx="10" fill="#212121" stroke="#333333"/>
<text x="926" y="626" class="t3" text-anchor="middle" style="fill:#dcdcdc">宁漏勿抢</text>
<text x="926" y="644" class="t3" text-anchor="middle" style="fill:#9c9c9c">宁可漏，不抢</text>
