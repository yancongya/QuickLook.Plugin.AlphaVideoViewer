<g>
<rect x="70" y="344" width="106" height="132" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<use href="#gift" x="78" y="365" width="90" height="90"/>
<rect x="176" y="344" width="106" height="132" rx="4" fill="#0a0a0a" stroke="#2e2e2e"/>
<use href="#gift" x="184" y="365" width="90" height="90"/>
</g>
<text x="70" y="496" class="t3">普通 MP4 / MOV / M4V</text>
<rect x="70" y="504" width="240" height="26" rx="13" fill="#1f1f1f" stroke="#2e2e2e"/>
<text x="190" y="521" class="t3" text-anchor="middle" style="fill:#cccccc">不是拼接素材</text>
<text x="70" y="548" class="t2" style="fill:#efefef">交回内置 VideoViewer</text>
</g>
<g class="br-b" filter="url(#soft)">
<rect x="392" y="286" width="284" height="270" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="1.6"/>
<rect x="392" y="286" width="284" height="44" rx="12" fill="#212121"/>
<rect x="392" y="314" width="284" height="16" fill="#212121"/>
<circle cx="418" cy="308" r="6" fill="#e8e8e8"/>
