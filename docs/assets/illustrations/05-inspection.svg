</defs><style>
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.hd{font-size:20px;fill:#efefef}.t1{font-size:16px;fill:#efefef}.t2{font-size:14px;fill:#9c9c9c}.t3{font-size:12.5px;fill:#7c7c7c}.bold{font-weight:600}.em{fill:#e8e8e8}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.panel{animation:panel 8s infinite}
@keyframes panel{0%,10%{opacity:.45;transform:translateX(26px)}22%,100%{opacity:1;transform:none}}
.picker{animation:pick 8s infinite}
@keyframes pick{0%,86%{opacity:1;transform:none}94%,100%{opacity:.25;transform:translateY(-6px)}}
.bgbtn{animation:bgbtn 8s infinite}
@keyframes bgbtn{0%,86%{fill:#262626;stroke:#e8e8e8}96%,100%{fill:#1f1f1f;stroke:#2e2e2e}}
.bgicon{animation:bgicon 8s infinite}
@keyframes bgicon{0%,86%{opacity:1}96%,100%{opacity:.55}}
.gift{transform-origin:352px 362px;animation:beat 8s ease-in-out infinite}
@keyframes beat{0%,36%{transform:scale(1)}44%{transform:scale(1.05)}52%{transform:scale(1)}60%{transform:scale(1.035)}68%,100%{transform:scale(1)}}
.cursor{animation:pointer 8s infinite}
@keyframes pointer{0%{transform:translate(-40px,44px);opacity:0}6%{opacity:1}14%,84%{transform:none;opacity:1}94%,100%{transform:translate(-40px,44px);opacity:0}}
.ring{animation:ring 8s infinite}
@keyframes ring{0%,86%{opacity:1}96%,100%{opacity:0}}
</style>
