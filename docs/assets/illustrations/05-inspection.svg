<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 720" role="img" aria-labelledby="title desc" data-run="paused">
<title id="title">切换背景，并展开文件信息面板查看合成细节</title><desc id="desc">AlphaVideoViewer 功能示意；分层 SVG 绘制的播放器界面与信息面板，不是 Windows 实测截图。</desc>
