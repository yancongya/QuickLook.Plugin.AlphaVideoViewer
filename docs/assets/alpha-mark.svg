<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="t">
<title id="t">AlphaVideoViewer</title>
<defs>
<linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#e8e8e8"/><stop offset="1" stop-color="#9a9a9a"/>
</linearGradient>
</defs>
<rect width="128" height="128" rx="28" fill="#0e0e0e"/>
<rect x="0" y="0" width="128" height="128" rx="28" stroke="#2f2f2f" stroke-width="2"/>
<!-- left half: grayscale alpha mask (stripes = luminance ramp) -->
<g stroke="#777777" stroke-width="4" stroke-linecap="round">
<path d="M24 44h30M24 57h30M24 70h30M24 83h30"/>
</g>
<rect x="20" y="36" width="38" height="56" rx="6" stroke="#3f3f3f" stroke-width="3"/>
<!-- right half: color rgb picture -->
<rect x="70" y="36" width="38" height="56" rx="6" fill="url(#ag)"/>
<path d="M79 74l12-16 9 11 8-9" stroke="#0e0e0e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- divider: the split seam -->
<path d="M64 32v64" stroke="#363636" stroke-width="3" stroke-dasharray="5 6"/>
<!-- composite arrow: two halves into one -->
<path d="M30 104h68" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
<path d="M92 96l9 8-9 8" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
