.pm-demo[data-mode=alpha] .timeline::-webkit-slider-runnable-track{background:linear-gradient(to right,#dedede 0%,#dedede var(--played),#ffffff3d var(--played),#ffffff3d 100%)}
.pm-demo[data-mode=alpha] .timeline::-moz-range-progress{background:#dedede}
@media(prefers-reduced-motion:reduce){.pm-demo .composite-result{transition:none!important}}
.pm-demo .alpha-animation image{filter:grayscale(1)}.pm-demo .alpha-caption{font-size:15px}.pm-demo .alpha-subcaption{font-size:12px}.pm-demo .alpha-phase{font-size:17px}.pm-demo .composite-result{transform-origin:300px 145px}
</style></head><body><div class="pm-demo" id="pm-stage" data-mode="alpha"><div class="aura"></div><div class="artifact" id="pm-artifact" role="group" tabindex="0" aria-label="Alpha 视频文件和透明预览播放器"><div class="page-content" id="pm-page"><div class="page-fold"></div><div class="file-mark"><img src="./assets/alpha-logo-mono.png" alt=""></div><div class="lines"><i></i><i></i><i></i></div><div class="type" id="pm-type">MP4</div></div><div class="viewer-content" id="pm-viewer"><div class="viewer-head"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="filename" id="pm-filename">gift-effect.mp4</span></div><div class="scene alpha-scene"><svg class="alpha-animation" viewBox="0 0 600 300" role="img" aria-label="灰度 Alpha 遮罩与 RGB 画面合成为真正透明的循环动画"><defs><pattern id="alpha-checker" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0h12v12H0zm12 12h12v12H12z" fill="#303030"/></pattern><linearGradient id="alpha-mask-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee"/><stop offset="1" stop-color="#737373"/></linearGradient><mask id="hero-opacity-mask" maskUnits="userSpaceOnUse" x="234" y="88" width="132" height="124" style="mask-type:luminance"><image href="./assets/illustrations/demo-mask.png" x="234" y="88" width="132" height="124" preserveAspectRatio="xMidYMid meet"/></mask></defs><g class="alpha-source"><rect x="24" y="48" width="154" height="194" rx="15" fill="#171717" stroke="#505050"/><text x="101" y="73" text-anchor="middle" class="alpha-caption">ALPHA MASK</text><image href="./assets/illustrations/demo-mask.png" x="35" y="88" width="132" height="124" preserveAspectRatio="xMidYMid meet"/><text x="101" y="221" text-anchor="middle" class="alpha-subcaption">OPACITY</text></g><g class="rgb-source"><rect x="422" y="48" width="154" height="194" rx="15" fill="#171717" stroke="#505050"/><text x="499" y="73" text-anchor="middle" class="alpha-caption">RGB FRAME</text><image href="./assets/illustrations/demo-rgb.png" x="433" y="88" width="132" height="124" preserveAspectRatio="xMidYMid meet"/><text x="499" y="221" text-anchor="middle" class="alpha-subcaption">COLOUR</text></g><path d="M208 145h48m-9-8 9 8-9 8M344 145h48m-9-8 9 8-9 8" fill="none" stroke="#777" stroke-width="2"/><text x="300" y="129" text-anchor="middle" class="alpha-multiply">×</text><g class="composite-result"><rect x="224" y="49" width="152" height="192" rx="16" fill="url(#alpha-checker)" stroke="#777"/><text x="300" y="74" text-anchor="middle" class="alpha-caption">REAL ALPHA</text><image href="./assets/illustrations/demo-rgb.png" x="234" y="88" width="132" height="124" preserveAspectRatio="xMidYMid meet" mask="url(#hero-opacity-mask)"/><text x="300" y="221" text-anchor="middle" class="alpha-subcaption">RGB × A → RGBA</text></g><text class="alpha-phase" x="300" y="282" text-anchor="middle" fill="#bdbdbd" font-size="11" font-family="monospace">01 ALPHA + RGB</text></svg><div class="controls" id="pm-controls"><button class="play-control" id="pm-play" type="button" aria-label="暂停动画" title="播放/暂停"><svg viewBox="0 0 20 20"><path d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg></button><input id="pm-timeline" class="timeline" type="range" min="0" max="4000" step="10" value="0" aria-label="动画时间轴"><span class="clock" id="pm-clock">00:00 / 00:04</span></div></div></div></div><span class="file-caption" id="pm-caption">gift-effect.mp4</span><div class="marquee" id="pm-marquee" aria-hidden="true"></div><div class="key-row"><button id="pm-key" class="key" type="button" aria-label="按住并松开 Space"><span>SPACE</span></button><span class="key-hint" id="pm-hint">选择文件后点击空格键即可预览</span></div><div class="status" id="pm-status" aria-live="polite">把鼠标移到文件上试试</div></div><script>

(()=>{
const $=id=>document.getElementById(id);
const stage=$('pm-stage'),art=$('pm-artifact'),key=$('pm-key'),status=$('pm-status');
const page=$('pm-page'),viewer=$('pm-viewer'),marquee=$('pm-marquee');
const FILE={w:104,h:130,r:11},PLAYER={w:332,h:242,r:18};
let phase='file',held=null,heldPointer=null,animationId=0,raf=0;
let selected=false,drag=null;
let inView=true;
if('IntersectionObserver' in window){
 new IntersectionObserver(es=>{inView=es.some(e=>e.isIntersecting)},{threshold:.2}).observe(stage);
}
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
let english=false,lastStatus='';
const phrases={
'文件已选中，按住 Space 后松开展开':'File selected. Press and release Space.',
'未选中文件':'Select a file first.',
'未选中文件，Space 无效':'Select a file before pressing Space.',
'可播放、暂停与拖动时间轴 · Space 键收回':'Play, pause or scrub. Space closes the preview.',
'鼠标悬停文件，或按住 Space 后松开':'Select the file, then press and release Space.',
'按住 Space，松开后切换':'Press Space; release to toggle.',
'松开后文件变为播放器':'Release to open the preview.',
'松开后播放器收回为文件':'Release to close the preview.',
'快速拉伸，播放器持续播放中…':'Opening the preview…',
'快速挤压，正在收回文件…':'Closing the preview…'
};
function say(s){lastStatus=s;status.textContent=english?(phrases[s]||s):s}
function updateLanguage(){
 document.documentElement.lang=english?'en':'zh-CN';
 $('pm-hint').textContent=english?'Select the file, then press Space':'选择文件后点击空格键即可预览';
 key.setAttribute('aria-label',english?'Press and release Space':'按住并松开 Space');
 art.setAttribute('aria-label',english?'Video file and QuickLook preview':'视频文件与 QuickLook 预览');
 timeline.setAttribute('aria-label',english?'Animation timeline':'动画时间轴');
 say(lastStatus);drawControls();
}
function select(v){
 if(selected===v)return;
 selected=v;art.classList.toggle('selected',v);
 say(v?'文件已选中，按住 Space 后松开展开':'未选中文件');
}
function nudge(){art.classList.remove('nudge');void art.offsetWidth;art.classList.add('nudge')}
function hits(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}
function interpolate(a,b,t){return a+(b-a)*t}
function easeOutBack(t){const s=1.28;return 1+Math.pow(t-1,3)*(s+1)+Math.pow(t-1,2)*s}
function color(a,b,t){t=Math.max(0,Math.min(1,t));return '#'+a.map((v,i)=>Math.round(interpolate(v,b[i],t)).toString(16).padStart(2,'0')).join('')}
const WHITE=[27,27,27],DARK=[8,8,8],BORDER1=[112,112,112],BORDER2=[43,43,43];
function widthForPlayer(){return Math.min(PLAYER.w,Math.max(FILE.w,stage.clientWidth-26))}
function geometry(isOpen){return isOpen?Object.assign({},PLAYER,{w:widthForPlayer()}):FILE}
function apply(isOpen){
 const s=geometry(isOpen);
 art.style.width=s.w+'px';art.style.height=s.h+'px';art.style.borderRadius=s.r+'px';
 art.style.backgroundColor=isOpen?'#0b1425':'#fff';
 art.style.borderColor=isOpen?'#22334b':'#b7c7d9';
 page.style.opacity=isOpen?'0':'1';
 viewer.style.opacity=isOpen?'1':'0';
 art.classList.toggle('opened',isOpen);
 art.classList.remove('morphing','closing');
 art.setAttribute('aria-label',isOpen?'播放器，使用播放按钮和时间轴控制':'文件，仅通过 Space 键展开');
 say(isOpen?'可播放、暂停与拖动时间轴 · Space 键收回':'鼠标悬停文件，或按住 Space 后松开');
}
function releaseKey(){
 key.classList.remove('down','releasing');
 void key.offsetWidth;
 key.classList.add('releasing');
}
function press(source,pid){
 if(phase==='transition'||held)return;
 if(phase==='file'&&!selected){nudge();say('未选中文件，Space 无效');return;}
 held=source;heldPointer=pid!==undefined?pid:null;
 key.classList.remove('releasing');key.classList.add('down');stage.classList.add('holding');
 say(phase==='file'?'松开后文件变为播放器':'松开后播放器收回为文件');
}
function release(source,pid){
 if(held!==source||(source==='pointer'&&pid!==heldPointer))return;
 held=null;heldPointer=null;
 stage.classList.remove('holding');releaseKey();
 toggle();
}
function cancelHold(){
 if(!held)return;
 held=null;heldPointer=null;
 key.classList.remove('down');stage.classList.remove('holding');
 say('按住 Space，松开后切换');
}
function toggle(){
 if(phase==='transition')return;
 cancelAnimationFrame(raf);
 const opening=phase==='file'; if(opening){currentMs=0;lastFrame=0;visualTime();}
 const from=geometry(!opening),to=geometry(opening);
 phase='transition';
 const token=++animationId;
 art.classList.remove('opened','morphing','closing');
 art.classList.add(opening?'morphing':'closing');
 say(opening?'快速拉伸，播放器持续播放中…':'快速挤压，正在收回文件…');
 if(reduced()){
   phase=opening?'open':'file';apply(opening);return;
 }
 const duration=510,start=performance.now();
 function step(now){
  if(token!==animationId)return;
  const t=Math.min(1,(now-start)/duration);
  const smooth=x=>1-Math.pow(1-x,3);
  let width,height;
  if(t<.15){
    const p=t/.15;
    width=from.w*(1+.095*p);
    height=from.h*(1-.105*p);
  }else{
    const p=(t-.15)/.85;
    const v=easeOutBack(p);
    const releaseW=from.w*1.095,releaseH=from.h*.895;
    width=interpolate(releaseW,to.w,v);
    height=interpolate(releaseH,to.h,v);
  }
  const fade=Math.min(1,Math.max(0,(t-.10)/.60));
  const roundingProgress=smooth(Math.max(0,(t-.15)/.85));
  art.style.width=Math.max(80,width)+'px';
  art.style.height=Math.max(90,height)+'px';
  art.style.borderRadius=interpolate(from.r,to.r,roundingProgress)+'px';
  const k=opening?fade:1-fade;
  art.style.backgroundColor=color(WHITE,DARK,k);
  art.style.borderColor=color(BORDER1,BORDER2,k);
  page.style.opacity=String(1-k);
  viewer.style.opacity=String(k);
  if(t<1){raf=requestAnimationFrame(step)}
  else{phase=opening?'open':'file';apply(opening)}
 }
 raf=requestAnimationFrame(step);
}
stage.addEventListener('pointerdown',e=>{
 if(phase!=='file'||e.target.closest('.key-row'))return;
 if(e.target.closest('#pm-artifact')){e.preventDefault();select(true);return;}
 if(e.pointerType!=='mouse'||e.button!==0)return;
 const r=stage.getBoundingClientRect();
 drag={x0:e.clientX-r.left,y0:e.clientY-r.top,moved:false};
});
window.addEventListener('pointermove',e=>{
 if(!drag)return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const dx=x-drag.x0,dy=y-drag.y0;
 if(!drag.moved&&Math.hypot(dx,dy)<5)return;
 drag.moved=true;
 marquee.style.display='block';
 marquee.style.left=Math.min(drag.x0,x)+'px';
 marquee.style.top=Math.min(drag.y0,y)+'px';
 marquee.style.width=Math.abs(dx)+'px';
 marquee.style.height=Math.abs(dy)+'px';
});
window.addEventListener('pointerup',()=>{
 if(!drag)return;
 const box=marquee.getBoundingClientRect(),moved=drag.moved;
 marquee.style.display='none';
 drag=null;
 select(moved?hits(box,art.getBoundingClientRect()):false);
});
art.addEventListener('focus',()=>{if(phase==='file')select(true)});
art.addEventListener('animationend',()=>art.classList.remove('nudge'));
key.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(phase==='transition'||held)return;
 e.preventDefault();press('pointer',e.pointerId);
 try{key.setPointerCapture(e.pointerId)}catch(_){}
});
key.addEventListener('pointerup',e=>release('pointer',e.pointerId));
window.addEventListener('pointerup',e=>release('pointer',e.pointerId));
key.addEventListener('pointercancel',cancelHold);
key.addEventListener('lostpointercapture',()=>{if(held==='pointer')cancelHold()});
key.addEventListener('click',e=>{e.preventDefault();if(e.detail===0&&!held){press('keyboard');release('keyboard')}});
window.addEventListener('keydown',e=>{
 if(e.code!=='Space'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
 const ae=document.activeElement;
 if(ae&&['INPUT','TEXTAREA','SELECT','OPTION'].includes(ae.tagName))return;
 if(ae&&ae.tagName==='BUTTON'&&ae.id!=='pm-key')return;
 if(ae&&ae.tagName==='A')return;
 if(ae&&ae.isContentEditable)return;
 if(!inView)return;
 e.preventDefault();press('keyboard');
});
window.addEventListener('keyup',e=>{
 if(e.code!=='Space')return;
 if(held==='keyboard'){e.preventDefault();release('keyboard')}
});
window.addEventListener('blur',cancelHold);
const playPause=$('pm-play'),timeline=$('pm-timeline'),clock=$('pm-clock');
const scene=$('pm-viewer');
const durationMs=4000; timeline.max=String(durationMs);
let currentMs=0,lastFrame=0,playing=true,dragging=false;
function visualTime(){
 const p=reduced()?.55:(currentMs%durationMs)/durationMs;
 const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
 const joined=ease((p-.08)/.18)*(1-ease((p-.88)/.12));
 const alpha=scene.querySelector('.alpha-source'),rgb=scene.querySelector('.rgb-source'),result=scene.querySelector('.composite-result');
 alpha?.setAttribute('transform','translate('+(joined*199)+' 0)');
 rgb?.setAttribute('transform','translate('+(-joined*199)+' 0)');
 if(alpha)alpha.style.opacity=String(1-joined);
 if(rgb)rgb.style.opacity=String(1-joined);
 if(result){result.style.opacity=String(joined);result.style.transform='scale('+(1+joined*.25)+')';}
 const label=scene.querySelector('.alpha-phase');
 if(label)label.textContent=p<.08?'01  ALPHA + RGB':p<.26?'02  ALIGN → MULTIPLY':p<.88?'03  RGB × A → RGBA':'REPLAY';
}
function clockText(ms){const seconds=Math.floor(ms/1000);return '00:'+String(seconds).padStart(2,'0')}
function drawControls(){
 timeline.value=Math.round(currentMs);
 timeline.style.setProperty('--played',(currentMs/durationMs*100)+'%');
 clock.textContent=clockText(currentMs)+' / 00:04';
 playPause.setAttribute('aria-label',english?(playing?'Pause animation':'Play animation'):(playing?'暂停动画':'播放动画'));
 playPause.title=english?(playing?'Pause':'Play'):(playing?'暂停':'播放');
 playPause.innerHTML=playing?'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg>':'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13l10-6.5z"/></svg>';
}
function tick(now){
 if(lastFrame&&playing&&!dragging&&phase==='open'&&inView&&!document.hidden&&!reduced()){currentMs=(currentMs+(now-lastFrame))%durationMs;}
 lastFrame=now;
 drawControls();
 visualTime();
 requestAnimationFrame(tick);
}
playPause.addEventListener('click',()=>{
 playing=!playing;
 visualTime();drawControls();
});
timeline.addEventListener('pointerdown',()=>{dragging=true});
timeline.addEventListener('input',()=>{
 dragging=true;currentMs=Number(timeline.value);
 visualTime();drawControls();
});
function endScrub(){if(!dragging)return;dragging=false;lastFrame=performance.now();visualTime();}
timeline.addEventListener('change',endScrub);
window.addEventListener('pointerup',endScrub);
window.addEventListener('pointercancel',endScrub);
drawControls();requestAnimationFrame(tick);
apply(false);

// WEB_CLONE_HOST_ADAPTER_START
let hostPaused=false, resumePlayback=false;
addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent)return;
 if(e.data?.type==='language'){english=!!e.data.english;updateLanguage();return;}
 if(e.data?.type==='hero-key'){
  if(e.data.phase==='down')press('keyboard');
  if(e.data.phase==='up'&&held==='keyboard')release('keyboard');
  if(e.data.phase==='cancel')cancelHold();
  return;
 }
 if(e.data?.type!=='motion')return;
 const paused=!!e.data.paused;
 if(paused===hostPaused)return;
 if(paused){resumePlayback=playing;playing=false;}else{playing=resumePlayback;lastFrame=0;}
 hostPaused=paused;document.body.dataset.hostPaused=String(paused);visualTime();drawControls();
});
// WEB_CLONE_HOST_ADAPTER_END
})();

</script></body></html>
